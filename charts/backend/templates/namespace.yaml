# a scope for names
# almost never change

apiVersion: v1
kind: Namespace
metadata:
  name: filmory

# ── apiVersion: v1 ───────────────────────────────────────────────────────────
# The Kubernetes CORE API group. Written as a bare "v1" because the core group
# is the original one and has no name. Everything added later is written
# "<group>/<version>" — see apps/v1 in deployment.yaml.
#
# Core group holds: Namespace, Service, Pod, ConfigMap, Secret, PersistentVolume
#
# A Namespace runs no process and consumes no resources
# it is a name scope and nothing else. 
# Objects inside it are addressed as:
#   <name>.<namespace>.svc.cluster.local   →   backend.filmory.svc.cluster.local
