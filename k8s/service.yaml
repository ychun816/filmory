apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: filmory
spec:
  type: ClusterIP     # reachable inside the cluster only; port-forward for now
  selector:
    app: backend      # sends traffic to every READY Pod carrying this label
  ports:
    - name: http
      port: 80        # the Service's own port
      targetPort: 8000  # the container's port
