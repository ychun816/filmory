# stable IP + DNS in front of churning Pods
# almost never change

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: filmory

spec:
  type: ClusterIP     # reachable inside the cluster only; port-forward for now
  
  # query -> "find every Pod in this namespace whose labels include app=backend." #sends traffic to every READY Pod carrying this label "backend"
  selector:
    app: backend      
  
  ports:
    - name: http
      port: 80        # the Service's own port
      targetPort: 8000  # the container's port

# ── apiVersion: v1 ───────────────────────────────────────────────────────────
# Core group again, same as namespace.yaml. Compare deployment.yaml, which is
# apps/v1 — Deployment was added after the core group was frozen.
#
# ── selector — note there is no matchLabels here ─────────────────────────────
# Same job as the Deployment's selector.matchLabels (find Pods by label), but written flat. 
# That is not a style choice: Service is an older API and supports only simple equality. 
# Deployment's newer form also allows matchExpressions (In, NotIn, Exists, DoesNotExist).
#
#   Service:      selector:  app: backend                 ← equality only
#   Deployment:   selector:  matchLabels: {app: backend}  ← or matchExpressions
#
# The Service routes to every Pod labelled app=backend that is READY. It never
# learns a Pod IP in advance, which is why Pods can be replaced freely.
