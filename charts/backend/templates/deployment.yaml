# define which image, how many replicas
# chnage on every deploy

apiVersion: apps/v1
kind: Deployment          # manages ReplicaSets, which manage Pods
metadata:
  name: backend
  namespace: filmory
spec:
  replicas: {{ .Values.replicaCount }}   # from values.yaml (default 2)
  selector:
    matchLabels:
      app: backend        # MUST match template.metadata.labels below — this is
                          # how the Deployment finds the Pods it owns

# ----- one pod setting -----
  template:               # everything below here describes ONE Pod
    metadata:
      labels:
        app: backend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: filmory-backend:0.1.1
          # 0.1.1 -> tag => also matches appVersion: "0.1.1"
          # IfNotPresent is essential with `kind load`: the image exists on the
          # node but NOT in any registry. Always would try to pull and fail.
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
          
          securityContext:
            allowPrivilegeEscalation: false         # setuid binaries gaining more privileges than the parent
            readOnlyRootFilesystem: true            # writing anywhere in the container -> needs the /tmp emptyDir
            capabilities:
              drop: ["ALL"]                         # the ~14 Linux capabilities containers get by default
  
  
  # Probes are why /health exists. Kubernetes calls it constantly.
      #     livenessProbe:        # failing = restart the container
      #       httpGet:
      #         path: /health
      #         port: 8000
      #       initialDelaySeconds: 5
      #       periodSeconds: 10
      #     readinessProbe:       # failing = pull the Pod out of the Service
      #       httpGet:
      #         path: /health
      #         port: 8000
      #       initialDelaySeconds: 2
      #       periodSeconds: 5
      #     resources:
      #       requests:           # what the scheduler reserves
      #         cpu: 50m
      #         memory: 64Mi
      #       limits:             # what the kernel enforces
      #         cpu: 500m
      #         memory: 256Mi
      #     volumeMounts:
      #       - name: tmp
      #         mountPath: /tmp   # needed because the root filesystem is read-only
      # volumes:
      #   - name: tmp
      #     emptyDir: {}






### NOTES ### 
# ── apiVersion: apps/v1 ──────────────────────────────────────────────────────
# Kubernetes objects are served by API GROUPS. The format is "<group>/<version>",
# except the original "core" group, which has no name and is written bare as "v1".
#
#   v1         core   → Namespace, Service, Pod, ConfigMap, Secret
#   apps/v1    apps   → Deployment, StatefulSet, DaemonSet, ReplicaSet
#   batch/v1   batch  → Job, CronJob
#
# Deployment is in "apps" because it was added after the core group was frozen.
# That is history, not hierarchy — apps/v1 is not "newer" or "better" than v1.
#
# This "v1" is UNRELATED to "apiVersion: v2" in Chart.yaml, which is the Helm
# chart format version.
#
# ── kind: Deployment — the alternatives ──────────────────────────────────────
# "kind" picks the CONTROLLER. Each has a different idea of what a set of Pods
# is for:
#
#   Deployment    stateless, interchangeable Pods. Random names, any node,
#                 rolling updates.                    ← what a web API wants
#   StatefulSet   stable identity — backend-0, backend-1 — each keeping its own
#                 PersistentVolume across restarts.   ← MySQL, Redis, NATS (Phase 7)
#   DaemonSet     exactly one Pod per node.           ← log shippers, CNI agents
#   Job           run to completion once, then stop.
#   CronJob       a Job on a schedule.                ← the weekly news scraper
#   Pod           one unmanaged Pod. Dies and stays dead. Debugging only.
#
# ── selector.matchLabels ─────────────────────────────────────────────────────
# How this Deployment finds the Pods it owns. NOT by name — Pod names are
# generated (backend-8485d79dc-79kbm). It owns every Pod carrying app=backend.
#
# It MUST match spec.template.metadata.labels above. If they disagree, the
# Deployment would create Pods it does not recognise as its own, then create
# more, forever — so the API server rejects the mismatch outright.
#
# IMMUTABLE after creation. Changing it means deleting and recreating the
# Deployment.
#
# Not the same as the Service's "selector" in service.yaml. Both read the same
# label for different purposes:
#   Deployment  "these Pods are mine — keep 2 of them alive"
#   Service     "these Pods get traffic — if they are ready"



# -------- POD setting --------
# runAsNonRoot: true
# kubelet refuses to start the container if its user resolves to UID 0

# runAsUser: 10001
# run processes as this UID, overriding the image's USER
# 1001 -> 

# seccompProfile: RuntimeDefault
# restrict which syscalls the process may make
# Linux has ~350 syscalls; a web app needs a few dozen. 
# RuntimeDefault -> applies the container runtime's allowlist, blocking the rest. Historically the default was Unconfined — no filtering at all.

